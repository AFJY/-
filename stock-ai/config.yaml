# Stock AI paper trading configuration
# 模拟盘配置 — 不涉及真实资金

market:
  indices:
    - symbol: "000001.SS"
      name: "上证指数"
    - symbol: "399001.SZ"
      name: "深证成指"
    - symbol: "SPY"
      name: "S&P 500 ETF"

  watchlist:
    - "600519.SS"  # 贵州茅台
    - "000858.SZ"  # 五粮液
    - "601318.SS"  # 中国平安
    - "300750.SZ"  # 宁德时代

trading:
  initial_capital: 1000000.0
  max_position_pct: 0.25
  commission_rate: 0.0003
  slippage_rate: 0.0005
  min_confidence: 0.55

# 月度收益周期
monthly:
  target_return_pct: 5.0        # 月目标收益率（模拟）
  state_file: "data/monthly_state.json"
  retrain_on_new_month: true

learning:
  lookback_days: 365
  retrain_interval_days: 7

news:
  enabled: true
  rss_feeds:
    - "https://feeds.finance.yahoo.com/rss/2.0/headline?s=^GSPC&region=US&lang=en-US"
  sentiment_weight: 0.15

# 实时盯盘
realtime:
  poll_interval_sec: 30         # 云端轮询间隔（秒）
  auto_trade: true              # 实时信号自动模拟下单
  prefer_ths_bridge: true       # 同花顺桥接连接时优先用桌面行情

runtime:
  data_dir: "data"
  model_dir: "models"
  log_dir: "logs"
  state_file: "data/portfolio_state.json"
  web_host: "0.0.0.0"
  web_port: 8765
